name: Daily compatibility check

# Runs the full test suite against the real mapgenie.io site every day, so a
# MapGenie-side change breaks a scheduled run here instead of someone's
# browser first. The badge in the README reflects the latest run of this
# workflow automatically (no extra scripting needed) - GitHub also emails
# the repo owner by default when a scheduled run fails.

on:
  schedule:
    - cron: "17 7 * * *" # once a day
  workflow_dispatch: {} # lets us trigger it manually too, from the Actions tab

jobs:
  compat-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MG_EMAIL: ${{ secrets.MG_EMAIL }}
      MG_PASSWORD: ${{ secrets.MG_PASSWORD }}
      # Firebase's web config isn't a secret (it's meant to be public, same
      # as on any site using Firebase - access is controlled by Firestore's
      # rules, not by hiding this). Safe to keep inline here.
      FIREBASE_API_KEY: AIzaSyCQrZRG9uh_Hk1ryPqRYNVjMY55AKbjdt8
      FIREBASE_AUTH_DOMAIN: fmg-fb.firebaseapp.com
      FIREBASE_PROJECT_ID: fmg-fb
      FIREBASE_STORAGE_BUCKET: fmg-fb.firebasestorage.app
      FIREBASE_MESSAGING_SENDER_ID: "578110367934"
      FIREBASE_APP_ID: 1:578110367934:web:dce705c1bf6f73c03396ef
      GOOGLE_OAUTH_CLIENT_ID: 578110367934-k0u71bl70n1rldass12oonoa0cjgt7m6.apps.googleusercontent.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Unit tests (map.js compatibility layer)
        run: node --test tests/map-compat.test.mjs

      - name: Build the extension
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests against the real site
        run: npx playwright test --project=chromium
