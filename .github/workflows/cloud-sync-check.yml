name: Cloud sync

# Separate from MapGenie compatibility on purpose: this only tests our own
# Firebase sync plumbing, not whether the extension works with MapGenie. A
# failure here means "cloud backup might be having an issue", not "the
# extension is broken" - those are different things and shouldn't share one
# badge.

on:
  schedule:
    - cron: "37 7 * * *" # once a day, offset from the compat-check run
  workflow_dispatch: {}

jobs:
  cloud-sync-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the README status table
    timeout-minutes: 25

    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: ci-results/cloud.json
      MG_EMAIL: ${{ secrets.MG_EMAIL }}
      MG_PASSWORD: ${{ secrets.MG_PASSWORD }}
      # Firebase's web config isn't a secret (it's meant to be public, same
      # as on any site using Firebase - access is controlled by Firestore's
      # rules, not by hiding this). Safe to keep inline here.
      FIREBASE_API_KEY: AIzaSyCQrZRG9uh_Hk1ryPqRYNVjMY55AKbjdt8
      FIREBASE_AUTH_DOMAIN: fmg-fb.firebaseapp.com
      FIREBASE_PROJECT_ID: fmg-fb
      FIREBASE_STORAGE_BUCKET: fmg-fb.firebasestorage.app
      FIREBASE_MESSAGING_SENDER_ID: "578110367934"
      FIREBASE_APP_ID: 1:578110367934:web:dce705c1bf6f73c03396ef
      GOOGLE_OAUTH_CLIENT_ID: 578110367934-k0u71bl70n1rldass12oonoa0cjgt7m6.apps.googleusercontent.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build the extension
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (cloud sync)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 4
          retry_wait_seconds: 30
          command: npx playwright test --project=chromium e2e/tests/cloud-sync.spec.ts --reporter=list,json

      # Runs even when the tests failed, that's the point: the README table
      # should show which check broke.
      - name: Update the README status table
        if: always()
        run: |
          node scripts/update-readme-status.mjs ci-results/cloud.json cloud
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update CI status table [skip ci]"
            git pull --rebase
            git push
          fi
